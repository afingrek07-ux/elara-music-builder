name: Сборка установщика Elara Music Builder

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Поднять файлы из папки ElaraMusicBuilder, если они загружены внутрь неё
        shell: pwsh
        run: |
          if (Test-Path ElaraMusicBuilder\src) {
            Get-ChildItem ElaraMusicBuilder -Force | Where-Object { $_.Name -ne '.github' } | Move-Item -Destination . -Force
            Write-Host 'Файлы перенесены в корень репозитория'
          }
          if (-not (Test-Path src\ElaraMusicBuilder\ElaraMusicBuilder.csproj)) { throw 'Не найден src\ElaraMusicBuilder\ElaraMusicBuilder.csproj — проверьте загрузку файлов' }

      - name: Установить .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Собрать программу (самодостаточная сборка, .NET устанавливать не нужно)
        run: dotnet publish src/ElaraMusicBuilder/ElaraMusicBuilder.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish

      - name: Скачать FFmpeg (GPL-сборка с x264) и положить в папку программы
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $urls = @(
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-7.1.zip',
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          )
          $ok = $false
          foreach ($u in $urls) {
            try {
              Write-Host "Загрузка $u"
              Invoke-WebRequest -Uri $u -OutFile ffmpeg.zip -UseBasicParsing
              $ok = $true; break
            } catch { Write-Warning "Не удалось: $u" }
          }
          if (-not $ok) { throw 'FFmpeg не скачан' }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          New-Item -ItemType Directory -Force -Path publish\ffmpeg | Out-Null
          $exe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $probe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $exe.FullName publish\ffmpeg\
          Copy-Item $probe.FullName publish\ffmpeg\
          $lic = Get-ChildItem ffmpeg_tmp -Recurse -Include LICENSE*,COPYING* | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName publish\ffmpeg\LICENSE.txt }
          Copy-Item docs\THIRD_PARTY_NOTICES.txt publish\ffmpeg\README.txt
          & publish\ffmpeg\ffmpeg.exe -hide_banner -version | Select-Object -First 1
          & publish\ffmpeg\ffmpeg.exe -hide_banner -encoders | Select-String 'libx264|aac '

      - name: Автотесты видеодвижка (настоящий FFmpeg на Windows)
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PATH = "$PWD\publish\ffmpeg;$env:PATH"
          dotnet run --project tests/EngineTests/EngineTests.csproj -c Release
          $code = $LASTEXITCODE
          if (Test-Path test-report.md) { Get-Content test-report.md -Encoding UTF8 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
          exit $code

      - name: Установить Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Собрать установщик ElaraMusicBuilder_Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc installer\ElaraMusicBuilder.iss "/DPublishDir=..\publish"
          if ($LASTEXITCODE -ne 0) { throw 'Ошибка сборки установщика' }
          Get-Item dist\ElaraMusicBuilder_Setup.exe | Format-List Name, Length

      - name: Выложить установщик
        uses: actions/upload-artifact@v4
        with:
          name: ElaraMusicBuilder_Setup
          path: dist/ElaraMusicBuilder_Setup.exe

      - name: Выложить отчёт и кадры тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            test-report.md
            test-output/*.png
            test-output/out/*.mp4
          if-no-files-found: ignore

      - name: Опубликовать релиз (только для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ElaraMusicBuilder_Setup.exe

      - name: Предупреждение о тестах
        if: steps.tests.outcome == 'failure'
        run: echo "::warning::Часть автотестов не пройдена. Установщик собран, но смотрите отчёт test-report."
